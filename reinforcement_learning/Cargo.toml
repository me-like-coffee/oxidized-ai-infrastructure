[package]
name = "reinforcement_learning"
version = "0.1.0"
edition = "2024"

[dependencies]
# Embedded Python interop framework
pyo3 = { version = "0.23", features = ["auto-initialize"] }

# High-performance native linear algebra
ndarray = "0.15"

# Utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"

[lib]
name = "reinforcement_learning"
path = "src/lib.rs"

